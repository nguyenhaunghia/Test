<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng Hợp Thống Kê - Smart School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --primary: #00b5e2; --primary-dark: #004c6d; --success: #10b981; --danger: #fb7185; --warning: #f59e0b; }
    body { background: radial-gradient(circle at top right, #38bdf8, #bae6fd); min-height: 100vh; font-family: 'Inter', sans-serif; color: #1e293b; }
    .card-glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,76,109,.05); border: 1px solid rgba(0,181,226,.15); }
    .loading-overlay { position: fixed; inset: 0; background: rgba(240,249,255,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: var(--primary); transition: opacity 0.3s; }
    
    .table-container { max-height: calc(100vh - 350px); overflow-y: auto; }
    .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-container::-webkit-scrollbar-thumb { background-color: #bae6fd; border-radius: 10px; }
    thead th { background: #f0f9ff; color: var(--primary-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #bae6fd; }
  </style>
</head>
<body class="antialiased">

<div id="loading" class="loading-overlay">
  <div class="w-14 h-14 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4 shadow-lg"></div>
  <div class="font-bold tracking-wide text-sm text-[#004c6d]" id="loadingText">Đang tổng hợp dữ liệu...</div>
</div>

<div id="global-header"></div>

<div class="w-full mx-auto px-4 sm:px-6 py-6">
  
  <div class="bg-gradient-to-b from-[#e0f2fe] to-[#bae6fd] rounded-[20px] p-4 shadow-sm mb-6 border border-[#bae6fd] flex flex-col xl:flex-row items-center justify-between gap-4">
    
    <div class="flex flex-wrap items-center gap-4 md:gap-8 w-full xl:w-auto justify-center xl:justify-start">
      <div class="flex items-center gap-2 text-[#004c6d] font-bold text-lg whitespace-nowrap">
         <i class="fas fa-chart-area text-[#00b5e2] text-2xl"></i> <span class="hidden sm:inline">Tổng Hợp Thống Kê</span>
      </div>

      <div id="dashboardWidgets" style="display: none;" class="flex items-center gap-4 sm:gap-6 bg-white/70 px-5 py-2 rounded-xl border border-white shadow-sm">
          <div class="flex items-center gap-2 cursor-help" title="Tổng Nhiệm Vụ Lớp">
              <div class="w-8 h-8 rounded-lg bg-[#00b5e2] text-white flex items-center justify-center text-sm shadow-sm"><i class="fas fa-list-ul"></i></div>
              <span class="text-xl font-black text-[#00b5e2]" id="widgetTotal">0</span>
          </div>
          <div class="flex items-center gap-2 cursor-help" title="Đã Hoàn Thành">
              <div class="w-8 h-8 rounded-lg bg-[#10b981] text-white flex items-center justify-center text-sm shadow-sm"><i class="fas fa-check-circle"></i></div>
              <span class="text-xl font-black text-[#10b981]" id="widgetDone">0</span>
          </div>
          <div class="flex items-center gap-2 cursor-help" title="Chưa Hoàn Thành">
              <div class="w-8 h-8 rounded-lg bg-[#f59e0b] text-white flex items-center justify-center text-sm shadow-sm"><i class="fas fa-hourglass-half"></i></div>
              <span class="text-xl font-black text-[#f59e0b]" id="widgetPending">0</span>
          </div>
          <div class="flex items-center gap-2 cursor-help" title="Không Đạt / Trễ Hạn">
              <div class="w-8 h-8 rounded-lg bg-[#fb7185] text-white flex items-center justify-center text-sm shadow-sm"><i class="fas fa-times-circle"></i></div>
              <span class="text-xl font-black text-[#fb7185]" id="widgetFailed">0</span>
          </div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto justify-end">
      <select id="testSelect" onchange="renderTable()" style="display: none;" class="bg-white border-2 border-[#e0f2fe] text-[#004c6d] font-bold rounded-xl px-4 py-2 outline-none focus:border-[#00b5e2] focus:ring-0 transition-all flex-1 sm:flex-none min-w-[180px] max-w-[250px] truncate">
        <option value="">-- Tất cả nhiệm vụ --</option>
      </select>
      
      <select id="classSelect" class="bg-white border-2 border-[#e0f2fe] text-[#004c6d] font-bold rounded-xl px-4 py-2 outline-none focus:border-[#00b5e2] focus:ring-0 transition-all flex-1 sm:flex-none min-w-[150px]">
        <option value="">-- Chọn Lớp --</option>
      </select>
      
      <button onclick="fetchThongKe()" class="bg-gradient-to-r from-[#00b5e2] to-[#004c6d] hover:shadow-lg hover:-translate-y-0.5 transform text-white px-5 py-2 rounded-xl font-bold transition-all flex items-center gap-2 whitespace-nowrap">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>

  </div>

  <div class="card-glass overflow-hidden">
    <div class="table-container bg-white">
      <table class="w-full text-sm text-left text-slate-600">
        <thead>
          <tr>
            <th class="px-4 py-4 w-12 text-center">STT</th>
            <th class="px-4 py-4">Mã HS - Tên Học Sinh</th>
            <th class="px-4 py-4 text-center w-24" title="Tổng số nhiệm vụ"><i class="fas fa-tasks text-lg text-[#00b5e2]"></i></th>
            <th class="px-4 py-4 text-center w-24" title="Đã hoàn thành (Đạt)"><i class="fas fa-check-circle text-lg text-[#10b981]"></i></th>
            <th class="px-4 py-4 text-center w-24" title="Đang thực hiện (Chưa hết hạn)"><i class="fas fa-hourglass-half text-lg text-[#f59e0b]"></i></th>
            <th class="px-4 py-4 text-center w-24" title="Không đạt (Trễ hạn / Thiểm thấp)"><i class="fas fa-times-circle text-lg text-[#fb7185]"></i></th>
            <th class="px-4 py-4 text-center w-16">Xem</th>
          </tr>
        </thead>
        <tbody id="dataTable" class="divide-y divide-slate-100">
          <tr><td colspan="7" class="text-center py-12 text-slate-400 font-semibold">Vui lòng chọn lớp và nhấn Tải dữ liệu</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script src="tonghop.js"></script>
</body>
</html>
