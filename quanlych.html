<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý câu hỏi - Smart School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="style.css"> 
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
<body class="flex flex-col h-screen text-white antialiased">

  

    <div id="loading" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #f0f9ff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <style>
      @keyframes loading-spin { 100% { transform: rotate(360deg); } }
    </style>
    <div style="width: 45px; height: 45px; border: 4px solid #e0f2fe; border-top-color: #00b5e2; border-radius: 50%; animation: loading-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
    <div style="color: #00b5e2; font-weight: 700; font-family: 'Inter', sans-serif; font-size: 15px; letter-spacing: 0.5px;">Đang kết nối hệ thống...</div>
  </div>



  <div id="global-header"></div>
  
  <div class="w-full flex-1 flex px-6 gap-6 pb-6 pt-6 overflow-hidden text-gray-800 mt-0">
    <div class="left-panel w-1/2 flex flex-col rounded-2xl">
      <div class="panel-content">
        <form id="f" class="flex flex-col gap-4">


          
          <div class="grid grid-cols-12 gap-x-3 gap-y-3">
            
            <div class="col-span-6 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Môn học"><i class="fas fa-book text-[16px]"></i></div>
              <select name="SubjectID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="loadKhoi(); updateSaveStatus();"><option value="">Đang tải...</option></select>
            </div>
            <div class="col-span-3 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Khối lớp"><i class="fas fa-users text-[16px]"></i></div>
              <select name="BlockID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="loadChude(); updateSaveStatus();"><option value="">Đang tải...</option></select>
            </div>
            <div class="col-span-3 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Loại câu hỏi"><i class="fas fa-question-circle text-[16px]"></i></div>
              <select name="TypeID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="updateSaveStatus();"><option value="">Đang tải...</option></select>
            </div>

            <div class="col-span-4 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Mức độ"><i class="fas fa-signal text-[16px]"></i></div>
              <select name="LevelID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="updateSaveStatus();"><option value="">Đang tải...</option></select>
            </div>
            <div class="col-span-8 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Chủ đề"><i class="fas fa-layer-group text-[16px]"></i></div>
              <select name="TopicID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm"><option value="">Đang tải...</option></select>
            </div>

            <div class="col-span-6 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Bài Test đã gán"><i class="fas fa-file-signature text-[16px]"></i></div>
              <select name="TestID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="updateSaveStatus();"><option value="">Đang tải...</option></select>
            </div>
            <div class="col-span-6 flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Tìm kiếm từ khóa"><i class="fas fa-search text-[16px]"></i></div>
              <input type="text" id="searchKeyword" name="searchKeyword" placeholder="Nhập từ khóa..." class="flex-1 min-w-0 h-[30px] px-4 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm">
            </div>

          </div>












          <div class="flex items-center justify-center gap-2 mt-2 mb-1 bg-white h-[52px] px-3 rounded-2xl border border-[#e0f2fe] shadow-[0_2px_10px_rgba(0,181,226,0.05)] w-max mx-auto hover:shadow-[0_4px_15px_rgba(0,181,226,0.15)] transition-shadow">
            <button type="button" id="btnFilter" onclick="filter()" class="h-[36px] px-4 flex items-center justify-center gap-2 rounded-xl text-white font-bold transition-all duration-300 bg-gradient-to-r from-[#00b5e2] to-[#004c6d] hover:shadow-md" title="Bấm để lọc dữ liệu"><i class="fas fa-filter text-[13px]"></i> <span class="text-[13px]">Lọc</span></button>
            <div class="w-px h-[24px] bg-gray-200 mx-1"></div> 
            <div id="navDisplay" class="min-w-[90px] h-[36px] flex items-center justify-center text-[14px] px-3 m-0 rounded-xl border !border-[#bbf7d0] !bg-[#f0fdf4] !text-[#16a34a] font-bold whitespace-nowrap transition-colors">1/0</div>
            <button type="button" id="prevBtn" onclick="nav(-2)" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl hover:bg-gray-100 text-gray-700 transition-colors outline-none"><i class="fas fa-step-backward text-[14px]"></i></button>
            <button type="button" id="nextBtn" onclick="nav(2)" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl hover:bg-gray-100 text-gray-700 transition-colors outline-none"><i class="fas fa-step-forward text-[14px]"></i></button>
            <div class="w-px h-[24px] bg-gray-200 mx-1"></div> 
            <button type="button" id="newBtn" onclick="newMode()" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-plus-circle text-[16px]"></i></button>
            <button type="button" id="copyBtn" onclick="copyMode()" style="display:none" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-copy text-[16px]"></i></button>
            <button type="button" id="editBtn" onclick="editMode()" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-edit text-[16px]"></i></button>
            <div class="flex items-center justify-center w-[36px] h-[36px] rounded-xl hover:bg-[#f0f9ff] text-[#00b5e2] cursor-pointer transition-colors outline-none" id="uploadButton" onclick="document.getElementById('imageUpload').click()" title="Đính kèm ảnh">
              <i class="fas fa-image text-[16px]" id="uploadIcon"></i><input type="file" id="imageUpload" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
            </div>
            <button type="button" id="saveBtn" onclick="save()" style="display:none" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-save text-[16px]"></i></button>
            <button type="button" id="delBtn" onclick="del()" style="display:none" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-trash-alt text-[16px]"></i></button>
            <div id="statusIcon"></div>
          </div>

          <div class="w-full mt-0 mb-0">
            <textarea name="QuestionLabel" placeholder="Nhập nội dung câu dẫn..." class="w-full min-h-[50px] p-4 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed font-medium shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
          </div>

          <div class="flex gap-4">
            <div class="flex-[3] flex flex-col gap-3">
              <textarea name="A" placeholder="Phương án A" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
              <textarea name="B" placeholder="Phương án B" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
              <textarea name="C" placeholder="Phương án C" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
              <textarea name="D" placeholder="Phương án D" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
            </div>
            <div class="flex-[2] flex flex-col">
              <div class="w-full h-full min-h-[116px] border-2 border-dashed border-[#bae6fd] rounded-2xl bg-[#f0f9ff] flex flex-col items-center justify-center relative overflow-hidden group cursor-pointer hover:bg-[#e0f2fe] hover:border-[#00b5e2] transition-all" onclick="if(edit) document.getElementById('imageUpload').click()" title="Click để tải ảnh lên">
                <img id="formImagePreview" src="" class="absolute inset-0 w-full h-full object-contain hidden p-2 z-10 bg-white" />
                <div id="formImagePlaceholder" class="text-center text-[#7dd3fc] group-hover:text-[#00b5e2] transition-colors"><i class="fas fa-image text-3xl mb-2"></i><p class="text-xs font-medium">Click / Kéo thả ảnh</p></div>
                <button type="button" id="removeImageBtn" class="absolute top-2 right-2 w-8 h-8 bg-white border border-gray-200 hover:bg-red-50 text-red-500 rounded-full shadow-md hidden z-20 transition-all hover:scale-110" onclick="event.stopPropagation(); removeFormImage();" title="Xóa ảnh"><i class="fas fa-trash-alt text-[13px]"></i></button>
              </div>
            </div>
          </div>

          <div class="w-full flex gap-3">
              <textarea name="Note" placeholder="Ghi chú" class="flex-1 min-h-[30px] h-[30px] px-4 py-1.5 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#f59e0b] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this);"></textarea>
              <textarea name="Keywords" placeholder="Từ khóa tìm kiếm nhanh" class="flex-1 min-h-[30px] h-[30px] px-4 py-1.5 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#f59e0b] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this);"></textarea>
          </div>
        </form>
      </div>
    </div>

    <div class="right-panel w-1/2 rounded-2xl">
      <div class="panel-content">
        <div class="preview-cards" id="previewCards"><em class="text-[#004c6d] opacity-60">Nhấn Lọc dữ liệu để xem danh sách câu hỏi</em></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

  </div>
  <div class="toast-container" id="toastContainer"></div>

  <div id="testManageModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-[10000] opacity-0 transition-opacity duration-300">
    <div class="bg-white w-[90%] max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[85vh] transform scale-95 transition-transform duration-300" id="testManageModalContent">
        
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-slate-50/50 rounded-t-2xl">
            <h3 class="text-lg font-bold text-[#004c6d] flex items-center gap-2">
                <i class="fas fa-link text-[#00b5e2]"></i> Cập nhật vào danh sách bài kiểm tra
            </h3>
            <button onclick="closeTestManageModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 text-gray-500 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white">
            <div id="modalLoading" class="flex flex-col items-center justify-center py-10 text-[#00b5e2]">
                <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                <p class="font-medium">Đang tải danh sách bài kiểm tra phù hợp...</p>
            </div>
            
            <div id="testListContainer" class="hidden flex-col gap-3">
                </div>
        </div>

        <div class="px-6 py-4 border-t border-gray-100 bg-slate-50/50 rounded-b-2xl flex justify-end gap-3">
            <button onclick="closeTestManageModal()" class="px-5 py-2 rounded-xl text-gray-600 font-bold hover:bg-gray-200 transition-colors">Đóng</button>
            <button id="btnSaveTestManage" onclick="saveTestManageData()" class="px-6 py-2 rounded-xl bg-gradient-to-r from-[#00b5e2] to-[#004c6d] text-white font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                <i class="fas fa-save"></i> Cập nhật
            </button>
        </div>
    </div>
  </div>

  <script> const IS_MANAGE_MODE = true; </script>
  <script src="script.js"></script>
  <script src="soanch.js"></script>


</body>
</html>
