<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soạn đề Trắc nghiệm - Smart School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="style.css"> 
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* =========================================================================================
       CSS TONE AQUA DUBAI PASTEL SÁNG (Đồng bộ với Index và Soanch)
       Nguyên tắc: Giữ nguyên bố trúc, chỉ thay đổi hệ màu HEX/RGBA và hiệu ứng bóng.
       ========================================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    /* Nền Sky Blue sang Ngọc bích nhạt */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; overflow-x: hidden; width: 100%; font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #38bdf8, #bae6fd); min-height: 100vh; color: white; font-size: 14px; }
    
    /* Giao diện Glass cho Wrapper */
    .app-wrapper { display: flex; flex-direction: column; height: calc(100vh - 80px); margin-top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); color: #1e293b; overflow: hidden; width: 100%; max-width: 100%; box-sizing: border-box; flex: 1; border-top: 1px solid rgba(0, 181, 226, 0.2); }
    
    .filter-panel { padding:20px; background: rgba(240, 249, 255, 0.5); border-bottom:1px solid #e0f2fe; display:flex; flex-direction:column; gap:10px; overflow-x:auto; flex-shrink:0; }
    .filter-row { display:flex; flex-wrap:wrap; gap:16px; align-items:end; }
    .filter-group { flex:1 1 180px; min-width:180px; display:flex; flex-direction:column; }
    .keyword-group { flex:1 1 100%; max-width:100%; display:grid; grid-template-columns:180px 1fr; gap:0 16px; align-items:end; }
    
    /* Màu nhãn Text */
    .keyword-group label, label { white-space:nowrap; margin-bottom:6px; align-self:center; font-weight:600; color:#004c6d; }
    .keyword-group input { width:100%; }
    
    /* Input & Select mặc định */
    select, input[type="text"], input[type="number"], textarea, select option { width: 100%; padding: 8px 12px; border: 1px solid #e0f2fe; border-radius: 8px; font-size: 14px; box-sizing: border-box; transition: all .2s; color: #1e293b !important; background-color: #f0f9ff !important; }
    select:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus { background-color: #ffffff !important; border-color:#00b5e2; box-shadow:0 0 0 3px rgba(0,181,226,.2); outline:none; }
    
    /* =========================================================================
       UPDATE TỪ GEMINI: ÉP CHIỀU CAO CHO LIST BOX LỌC VÀ NÚT ĐỒNG BỘ (48px)
       ========================================================================= */
    .filter-group select, 
    .keyword-group input[type="text"], 
    #btnFilter, 
    #btnRefresh {
        height: 48px !important;
    }
    /* Phá giới hạn trình duyệt cho thẻ select để nhận chiều cao */
    .filter-group select {
        appearance: none !important;
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23004c6d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E") !important;
        background-repeat: no-repeat !important;
        background-position: right 12px center !important;
        background-size: 16px !important;
        padding-right: 36px !important; /* Chừa chỗ cho mũi tên mới */
    }
    /* ========================================================================= */

    .main-content { flex:1; display:flex; overflow:hidden; flex-direction:row; }
    @media (max-width:900px){ .main-content{flex-direction:column} .panel{border-right:none; border-bottom:1px solid #e0f2fe} .panel:last-child{border-bottom:none} }
    .panel { display:flex; flex-direction:column; border-right:1px solid #e0f2fe; overflow:hidden; }
    .panel:first-child { flex: 4.5; }
    .panel:last-child { flex: 5.5; border-right:none; }
    
    /* Header của Panel */
    .panel-header { padding:12px 24px; background:#f0f9ff; color:#004c6d; font-weight:700; font-size:17px; border-bottom:1px solid #e0f2fe; display:flex; align-items:center; justify-content:space-between; min-height:64px; box-sizing:border-box; flex-wrap:wrap; gap:10px; }
    
    #rightHeaderContent { display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:space-between; width:100%; }
    #rightTitleGroup { display:flex; align-items:center; gap:12px; }
    #exportContainer { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; flex:1; }
    
    /* NÚT BẤM (Cập nhật tone Aqua, Deep Navy, Amber) */
    #saveDeBtn { background:#00b5e2; box-shadow: 0 4px 10px rgba(0,181,226,0.3); } 
    #saveDeBtn:hover:not(:disabled) { background:#004c6d; transform: translateY(-2px); }
    #maDeListBtn { background:#f59e0b; box-shadow: 0 4px 10px rgba(245,158,11,0.3); } 
    #maDeListBtn:hover:not(:disabled) { background:#d97706; transform: translateY(-2px); }
    #quickSaveBtn { background:#10b981; box-shadow: 0 4px 10px rgba(16,185,129,0.3); } 
    #quickSaveBtn:hover:not(:disabled) { background:#059669; transform: translateY(-2px); }
    #exportBtn { background:#0ea5e9; box-shadow: 0 4px 10px rgba(14,165,233,0.3); }
    #exportBtn:hover:not(:disabled) { background:#0284c7; transform: translateY(-2px); }
    #quickSaveBtn:disabled, #saveDeBtn:disabled, #exportBtn:disabled { background:#94a3b8; opacity:0.6; box-shadow: none; transform: none; }
    
    /* Nút Lọc */
    #btnFilter { background: linear-gradient(135deg, #00b5e2, #004c6d); border: none; }
    #btnFilter:hover { background: linear-gradient(135deg, #00c9fa, #005a82); box-shadow: 0 4px 12px rgba(0,181,226,0.4); }

    .cards-wrapper { flex:1; overflow-y:auto; padding:24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:24px; position:relative; overflow-x:hidden; scrollbar-width: thin; scrollbar-color: #00b5e2 #f0f9ff; }
    .no-results { text-align:center; padding:60px; color:#94a3b8; font-size:18px; grid-column:1/-1; }
    
    /* Phân trang */
    .pagination { padding:12px 24px; text-align:center; border-top:1px solid #e0f2fe; background:#f8fafc; }
    .pagination button { padding:6px 12px; margin:0 4px; border:1px solid #e0f2fe; border-radius:6px; background:white; cursor:pointer; color:#64748b; transition:all .2s; }
    .pagination button:hover:not(:disabled) { border-color:#00b5e2; color:#00b5e2; }
    .pagination button:disabled { opacity:.5; cursor:not-allowed; }
    .pagination button.active { background:#00b5e2; color:white; border-color:#00b5e2; box-shadow: 0 2px 6px rgba(0,181,226,0.3); }
    
    /* Thẻ câu hỏi Preview - Đồng bộ tone sáng */
    .preview-card { background:#fff; border-radius:16px; border:1px solid #e0f2fe; padding:24px; box-shadow:0 4px 12px rgba(0,76,109,0.04); transition:all .3s ease; position:relative; overflow:hidden; }
    .preview-card:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(0,181,226,0.12); border-color:#00b5e2; }
    .preview-card .meta-tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; padding-right: 120px; }
    .preview-card .meta-tag { background:#f0f9ff; color:#004c6d; padding:4px 12px; border-radius:50px; font-size:12px; font-weight:600; border: 1px solid rgba(0,181,226,0.1); }
    .card-actions-box { position:absolute; top:16px; right:16px; display:flex; align-items:center; gap:12px; z-index:20; }
    
    /* Nút số thứ tự câu hỏi */
    .card-number { background: linear-gradient(135deg, #00b5e2, #004c6d); color:white; padding:8px 14px; border-radius:20px; font-size:14px; font-weight:bold; box-shadow:0 4px 12px rgba(0,181,226,0.3); }
    .select-icon { font-size:28px; cursor:pointer; transition:.2s; background: white; border-radius: 50%; display: flex; }
    .add-icon { color:#00b5e2; } .add-icon:hover { color:#004c6d; transform:scale(1.1); }
    .remove-icon { color:#fb7185; } .remove-icon:hover { color:#e11d48; transform:scale(1.1); }
    
    .preview-card .question-text { font-size:16px; font-weight:600; color:#004c6d; margin-bottom:16px; line-height:1.8; text-align: justify; }
    .preview-image { max-height:80mm; width:100%; object-fit:contain; border-radius:12px; margin:12px 0; box-shadow:0 8px 24px rgba(0,76,109,0.1); border:2px solid #f0f9ff; transition:all .3s ease; cursor: zoom-in; background: white; }
    .preview-card .options { display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.8; }
    .preview-card .options div { padding:8px 0; border-bottom:1px dashed #e0f2fe; text-align: justify; color: #334155; }
    .preview-card .extra-info { margin-top:16px; font-size:13px; color:#64748b; text-align: justify; background: #f8fafc; padding: 10px; border-radius: 8px; }
    
    .preview-card.split-layout .split-content { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; margin-top: 16px; }
    .preview-card.split-layout .card-main { display: flex; flex-direction: column; min-width: 0; }
    .preview-card.split-layout .preview-image { width: 100%; height: auto; max-height: 250px; object-fit: contain; align-self: start; margin: 0; border: 2px solid #e0f2fe; background: #ffffff; padding: 4px; border-radius: 8px; }

    #imageModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,76,109,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
    #imageModal img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    #imageModal .close-modal { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; opacity: 0.8; transition: opacity 0.3s; z-index: 2001; }
    #imageModal .close-modal:hover { opacity: 1; color: #00b5e2; }
    
    .loading-overlay { position: fixed; inset: 0; background: rgba(240,249,255,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #00b5e2; }
  </style> 
</head>
<body class="flex flex-col h-screen text-white antialiased">
  <div id="loading" class="loading-overlay">
    <div class="w-14 h-14 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="font-bold tracking-wide">Đang kết nối hệ thống...</div>
  </div>

  <div id="global-header"></div>

  <div class="app-wrapper">
    <div class="filter-panel">
      <div class="filter-row">
        <div class="filter-group"><label>Môn</label><select name="mon"></select></div>
        <div class="filter-group"><label>Khối</label><select name="khoi"></select></div>
        <div class="filter-group"><label>Chủ đề</label><select name="chude"></select></div>
        <div class="filter-group"><label>Loại câu hỏi</label><select name="loai"></select></div>
        <div class="filter-group"><label>Mức độ</label><select name="mucdo"></select></div>
        <div class="mt-4">
        <button id="btnFilter" class="w-full text-white font-bold py-2 px-2 rounded-lg transition duration-300">
            <i class="fas fa-search mr-1"></i> Lọc
        </button>
        </div>
        <button id="btnRefresh" class="bg-[#e0f2fe] hover:bg-[#bae6fd] text-[#004c6d] px-2 py-2 rounded-lg transition-colors" title="Làm mới dữ liệu"><i class="fas fa-sync-alt"></i></button>
    </div>

      <div class="filter-row">
        <div class="keyword-group">
          <label for="keywordSearch">Tìm kiếm từ khóa</label>
          <input type="text" id="keywordSearch" placeholder="Nhập từ khóa ..." oninput="handleSearchInput()" />
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="panel">
        <div class="panel-header" id="leftHeader">Ngân hàng câu hỏi</div>
        <div class="cards-wrapper" id="leftCards"></div>
        <div class="pagination" id="leftPagination"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div id="rightHeaderContent">
            <div id="rightTitleGroup">
              Đã chọn: <span id="selectedCount" class="text-[#00b5e2] font-black text-xl">0</span> câu
            </div>
            <div id="exportContainer">
              <button class="btn-v1 w-10 h-10 text-white rounded-lg transition-all" id="maDeListBtn" onclick="showMaDeListModal()" title="Danh sách mã đề">
                <i class="fas fa-list-alt"></i>
              </button>
              <button class="btn-v1 w-10 h-10 text-white rounded-lg transition-all" id="quickSaveBtn" onclick="quickSaveCurrentMaDe()" disabled title="Lưu nhanh">
                <i class="fas fa-check"></i>
              </button>
              <button class="btn-v1 w-10 h-10 text-white rounded-lg transition-all" id="saveDeBtn" onclick="showSaveDeDialog()" disabled title="Lưu mới">
                <i class="fas fa-save"></i>
              </button>
              <button class="btn-v1 w-10 h-10 text-white rounded-lg transition-all" id="exportBtn" onclick="exportToWord()" disabled title="Xuất Word">
                <i class="fas fa-file-word"></i>
              </button>
              <div id="exportStatus" class="export-status text-sm text-[#00b5e2] font-medium"></div>
            </div>
          </div>
        </div>
        <div class="cards-wrapper" id="rightCards"></div>
        <div class="pagination" id="rightPagination"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 bg-white text-gray-800 p-4 rounded-xl shadow-2xl border-l-4 border-[#00b5e2] flex items-center gap-3 transform translate-y-20 opacity-0 transition-all z-[9999]">
    <i id="toastIcon" class="text-xl text-[#00b5e2]"></i>
    <span id="toastMessage" class="font-medium"></span>
  </div>

  <div id="imageModal">
    <span class="close-modal" onclick="closeImageModal()">&times;</span>
    <img id="zoomedImage" src="" alt="Phóng to hình ảnh" onclick="event.stopPropagation()">
  </div>

  <div id="saveDeModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,76,109,0.6); z-index:99999; justify-content:center; align-items:center; padding:16px; backdrop-filter:blur(6px); box-sizing:border-box;">
    <div style="background:#fff; border-radius:24px; width:100%; max-width:500px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,181,226,0.3); border: 1px solid rgba(0,181,226,0.2);">
      <div style="background:linear-gradient(135deg, #00b5e2, #004c6d); color:white; padding:16px 24px; font-size:18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
        <span><i class="fas fa-save mr-2"></i> Lưu nhiệm vụ học tập</span>
        <span onclick="document.getElementById('saveDeModal').style.display='none'" style="cursor:pointer; font-size:28px; line-height:1; opacity:0.8; transition:0.2s;" onmouseover="this.style.color='#f59e0b'" onmouseout="this.style.color='white'">&times;</span>
      </div>
      <div style="padding:24px; display:flex; flex-direction:column; gap:5px; color:#1e293b;">
        <div style="display:grid; grid-template-columns:100px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Môn <span style="color:#fb7185">*</span></label>
          <select id="saveMonModal" style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; outline:none; background:#f0f9ff;"></select>
        </div>
        <div style="display:grid; grid-template-columns:100px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Khối <span style="color:#fb7185">*</span></label>
          <select id="saveKhoiModal" style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; outline:none; background:#f0f9ff;"></select>
        </div>
        <div style="display:grid; grid-template-columns:100px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Chủ đề <span style="color:#fb7185">*</span></label>
          <input type="text" id="saveChuDeOnTap" placeholder="VD: Ôn tập giữa kỳ" style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; outline:none; background:#f0f9ff;">
        </div>

        <div style="display:grid; grid-template-columns:105px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Tổng số câu</label>
          <input type="number" id="saveTongSoCau" disabled style="width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:8px; background:#f8fafc; font-weight:bold; color:#64748b;" title="Tổng số câu hỏi bạn đã chọn">
        </div>

        <div style="display:grid; grid-template-columns:105px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Số câu làm <span style="color:#fb7185">*</span></label>
          <input type="number" id="saveSoCauHoi" min="1" style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; font-weight:bold; color:#00b5e2; outline:none; background:#f0f9ff;" title="Số câu lấy ngẫu nhiên cho học sinh làm">
        </div>

        <div style="display:grid; grid-template-columns:100px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Hiệu lực</label>
          <select id="saveHieuLuc" style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; outline:none; background:#f0f9ff;">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div style="display:grid; grid-template-columns:100px 1fr; align-items:center; gap:10px;">
          <label style="font-weight:600; color:#004c6d;">Thời gian</label>
          <input type="number" id="saveThoiLuong" placeholder="0 = Không giới hạn" value="0" style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; outline:none; background:#f0f9ff;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600; color:#004c6d;">Ghi chú</label>
          <textarea id="saveGhiChu" placeholder="Nhập ghi chú..." style="width:100%; padding:10px 12px; border:1px solid #e0f2fe; border-radius:8px; min-height:80px; outline:none; resize:vertical; background:#f0f9ff;"></textarea>
        </div>
        <div id="saveStatus" style="text-align:center; color:#fb7185; font-weight:bold; font-size:14px;"></div>
      </div>
      <div style="padding:16px 24px; background:#f8fafc; display:flex; justify-content:flex-end; gap:12px; border-top:1px solid #e0f2fe;">
        <button onclick="document.getElementById('saveDeModal').style.display='none'" style="padding:10px 24px; background:#fff; border:1px solid #cbd5e1; border-radius:8px; cursor:pointer; font-weight:600; color:#64748b; transition:0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#fff'">Hủy</button>
        <button id="btnSaveNew" onclick="saveDeThi(false)" style="padding:10px 24px; background:#00b5e2; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; transition:0.2s; box-shadow:0 4px 10px rgba(0,181,226,0.3);" onmouseover="this.style.background='#004c6d'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='#00b5e2'; this.style.transform='none'">Lưu mới</button>
        <button id="btnUpdateExisting" onclick="saveDeThi(true)" style="display:none; padding:10px 24px; background:#10b981; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; transition:0.2s; box-shadow:0 4px 10px rgba(16,185,129,0.3);" onmouseover="this.style.background='#059669'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='#10b981'; this.style.transform='none'">Cập nhật</button>
      </div>
    </div>
  </div>

  <div id="maDeListModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,76,109,0.6); z-index:99999; justify-content:center; align-items:center; padding:16px; backdrop-filter:blur(6px); box-sizing:border-box;">
    <div style="background:#fff; border-radius:24px; width:100%; max-width:900px; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,181,226,0.3); border: 1px solid rgba(0,181,226,0.2);">
      <div style="background:linear-gradient(135deg, #f59e0b, #d97706); color:white; padding:16px 24px; font-size:18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
        <span><i class="fas fa-list-alt mr-2"></i> DANH SÁCH NHIỆM VỤ</span>
        <span onclick="document.getElementById('maDeListModal').style.display='none'" style="cursor:pointer; font-size:28px; line-height:1; opacity:0.8; transition:0.2s;" onmouseover="this.style.color='#004c6d'" onmouseout="this.style.color='white'">&times;</span>
      </div>
      <div style="flex:1; overflow-y:auto; padding:24px; background:#f0f9ff; scrollbar-width: thin; scrollbar-color: #f59e0b #fffbeb;">
        <input type="text" id="maDeSearch" placeholder="Tìm mã đề, môn, khối, chủ đề..." oninput="filterMaDeList()" style="width:100%; padding:14px 16px; border:2px solid #e0f2fe; border-radius:12px; margin-bottom:20px; font-size:15px; outline:none; transition:0.3s; background:white;" onfocus="this.style.borderColor='#f59e0b'; this.style.boxShadow='0 0 0 3px rgba(245,158,11,0.2)'" onblur="this.style.borderColor='#e0f2fe'; this.style.boxShadow='none'">
        <div id="maDeListContent" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px;"></div>
      </div>
    </div>
  </div>

  <div id="shuffleModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,76,109,0.6); z-index:99999; justify-content:center; align-items:center; padding:16px; backdrop-filter:blur(6px); box-sizing:border-box;">
    <div style="background:#fff; border-radius:24px; width:100%; max-width:400px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,181,226,0.3); border: 1px solid rgba(0,181,226,0.2);">
      <div style="background:linear-gradient(135deg, #0ea5e9, #0284c7); color:white; padding:16px 24px; font-size:18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
        <span><i class="fas fa-file-word mr-2"></i> Tùy chọn Xuất Word</span>
        <span onclick="document.getElementById('shuffleModal').style.display='none'" style="cursor:pointer; font-size:28px; line-height:1; opacity:0.8; transition:0.2s;" onmouseover="this.style.color='#f59e0b'" onmouseout="this.style.color='white'">&times;</span>
      </div>
      <div style="padding:24px; display:flex; flex-direction:column; gap:20px; color:#1e293b;">
        <label style="display:flex; align-items:center; gap:12px; cursor:pointer; font-size:16px; font-weight:600; color:#004c6d;">
          <input type="checkbox" id="shuffleQuestions" style="width:20px; height:20px; accent-color:#00b5e2;"> Xáo trộn thứ tự Câu hỏi
        </label>
        <label style="display:flex; align-items:center; gap:12px; cursor:pointer; font-size:16px; font-weight:600; color:#004c6d;">
          <input type="checkbox" id="shuffleAnswers" style="width:20px; height:20px; accent-color:#00b5e2;"> Xáo trộn thứ tự Đáp án
        </label>
        <div style="text-align:center; font-size:15px; color:#64748b; margin-top:10px; padding-top:16px; border-top:1px dashed #e0f2fe;">
          Số câu hỏi sẽ xuất: <strong id="shuffleCount" style="color:#0ea5e9; font-size:24px;">0</strong>
        </div>
      </div>
      <div style="padding:16px 24px; background:#f8fafc; display:flex; justify-content:flex-end; gap:12px; border-top:1px solid #e0f2fe;">
        <button onclick="document.getElementById('shuffleModal').style.display='none'" style="padding:10px 24px; background:#fff; border:1px solid #cbd5e1; border-radius:8px; cursor:pointer; font-weight:600; color:#64748b; transition:0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#fff'">Hủy</button>
        <button onclick="confirmExport()" style="padding:10px 24px; background:#0ea5e9; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; transition:0.2s; box-shadow:0 4px 10px rgba(14,165,233,0.3);" onmouseover="this.style.background='#0284c7'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='#0ea5e9'; this.style.transform='none'">Tạo File Word</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="soandeTN.js"></script>
</body>
</html>
