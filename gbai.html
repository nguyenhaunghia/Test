<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao nhiệm vụ - Smart School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* =========================================================================================
       CSS TONE AQUA DUBAI PASTEL SÁNG (Đồng bộ hệ thống)
       ========================================================================================= */
    body {
      background: radial-gradient(circle at top right, #38bdf8, #bae6fd);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #1e293b;
    }

    /* Thẻ Giao Bài Glassmorphism Tone Sáng */
    .card-glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 181, 226, 0.15);
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0, 76, 109, 0.05);
      transition: all 0.3s ease;
      padding: 24px;
    }

    .card-glass:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(0, 181, 226, 0.15);
      border-color: rgba(0, 181, 226, 0.3);
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* Nút bấm chức năng */
    .btn-giao { background: linear-gradient(135deg, #00b5e2, #004c6d); color: white; box-shadow: 0 4px 12px rgba(0, 181, 226, 0.3); border: none; }
    .btn-xoa { background: rgba(251, 113, 133, 0.1); color: #fb7185; border: 1px solid rgba(251, 113, 133, 0.3); }
    .btn-xoa:hover { background: #fb7185; color: white; box-shadow: 0 4px 12px rgba(251, 113, 133, 0.3); }
    .btn-action:hover { transform: translateY(-2px); }

    /* Ô Tìm kiếm */
    .search-input {
      background: rgba(255,255,255,0.9);
      border: 2px solid #e0f2fe;
      padding: 14px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      font-size: 16px;
      color: #004c6d;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,76,109,0.05);
    }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus { outline: none; border-color: #00b5e2; box-shadow: 0 0 0 4px rgba(0, 181, 226, 0.15); background: #ffffff; }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(240,249,255,0.98);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: #00b5e2;
    }

    /* Modal Chọn Học Sinh - Tone Sáng */
    .modal-glass {
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 181, 226, 0.2);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 76, 109, 0.2);
      width: 95%; max-width: 1100px;
    }

    /* Scrollbar custom */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,181,226,0.05); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,181,226,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,181,226,0.4); }
    
    /* Chỉnh sửa style Input/Select trong Modal */
    .modal-glass input[type="datetime-local"], .modal-glass input[type="number"], .modal-glass input[type="text"], .modal-glass select {
      background: #f0f9ff !important;
      color: #004c6d !important;
      border: 1px solid #e0f2fe !important;
      transition: all 0.2s;
    }
    .modal-glass input:focus, .modal-glass select:focus {
      background: #ffffff !important;
      border-color: #00b5e2 !important;
      box-shadow: 0 0 0 2px rgba(0,181,226,0.1);
    }
    .modal-glass select option { background: #ffffff !important; color: #004c6d !important; }
  </style>
</head>
<body class="text-gray-800 antialiased">

  <div id="pageLoading" class="loading-overlay">
    <div class="w-16 h-16 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-6"></div>
    <div class="text-xl font-bold text-[#004c6d]">Đang ghi nhiệm vụ học tập...</div>
    <div class="text-sm mt-2 text-[#00b5e2] font-medium">Đang lưu theo danh sách ID học sinh</div>
  </div>

  <div id="mainLoading" class="loading-overlay" style="display: flex;">
    <div class="w-14 h-14 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="font-bold text-lg text-[#004c6d]">Đang tải danh sách mã đề...</div>
  </div>

  <div class="min-h-screen">
    <div id="global-header"></div>

    <div class="max-w-7xl mx-auto px-6 py-8">
      <div class="relative max-w-2xl mx-auto group">
        <input type="text" id="searchInput" oninput="filterList()" class="search-input pr-12" placeholder="Tìm kiếm mã đề, môn, khối...">
        <i class="fas fa-search absolute right-5 top-1/2 -translate-y-1/2 text-[#00b5e2] group-hover:text-[#004c6d] transition text-xl"></i>
      </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 pb-20">
      <div id="maDeListContent" class="grid grid-cols-1 lg:grid-cols-2 gap-8"></div>

      <div id="noResults" class="text-center py-24 text-2xl opacity-80 hidden">
        <div class="bg-[#e0f2fe] w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
           <i class="fas fa-search text-4xl text-[#00b5e2]"></i>
        </div>
        <p class="text-[#004c6d] font-bold">Không tìm thấy mã đề phù hợp</p>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <div id="giaoModal" class="fixed inset-0 bg-[rgba(0,76,109,0.5)] backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="modal-glass flex flex-col max-h-[90vh] animate-fade-in-up">
      
      <div class="px-6 py-5 border-b border-[#e0f2fe] flex justify-between items-center bg-[#f0f9ff] rounded-t-[24px]">
        <div>
          <h2 class="text-xl font-black flex items-center gap-3 text-[#004c6d]">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#00b5e2] to-[#0ea5e9] flex items-center justify-center text-white shadow-md">
              <i class="fas fa-rocket"></i>
            </div>
            Thiết lập giao bài
          </h2>
          <p class="text-xs text-[#00b5e2] font-bold mt-1.5 ml-[52px]" id="modalMaDeTitle"></p>
        </div>
        <button class="w-8 h-8 rounded-full bg-white border border-[#e0f2fe] hover:bg-[#fb7185] hover:text-white text-[#64748b] flex items-center justify-center transition shadow-sm" onclick="hideGiaoModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar bg-white">
        
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
          <div class="col-span-1">
            <label class="text-[11px] font-bold text-[#00b5e2] mb-1.5 block uppercase tracking-wider">Bắt đầu</label>
            <input type="datetime-local" id="batDau" class="w-full px-3 py-2.5 rounded-lg">
          </div>
          <div class="col-span-1">
            <label class="text-[11px] font-bold text-[#00b5e2] mb-1.5 block uppercase tracking-wider">Kết thúc</label>
            <input type="datetime-local" id="ketThuc" class="w-full px-3 py-2.5 rounded-lg">
          </div>
          
          <div class="col-span-1 setting-field">
            <label class="text-[11px] font-bold text-[#00b5e2] mb-1.5 block uppercase tracking-wider">Số lượt</label>
            <input type="number" id="soLuot" min="1" value="1" class="w-full px-3 py-2.5 rounded-lg text-center font-bold text-lg">
          </div>
          <div class="col-span-1 setting-field">
            <label class="text-[11px] font-bold text-[#00b5e2] mb-1.5 block uppercase tracking-wider">Điểm Max</label>
            <input type="number" id="diemCao" step="0.1" value="10" class="w-full px-3 py-2.5 rounded-lg text-center font-bold text-lg">
          </div>
          <div class="col-span-1 setting-field">
            <label class="text-[11px] font-bold text-[#00b5e2] mb-1.5 block uppercase tracking-wider">Điểm TB</label>
            <input type="number" id="diemTB" step="0.1" value="5" class="w-full px-3 py-2.5 rounded-lg text-center font-bold text-lg">
          </div>
        </div>

        <hr class="border-[#e0f2fe]">

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <div class="md:col-span-3">
             <select id="filterTruong" onchange="loadLopList()" class="w-full px-4 py-3 rounded-xl cursor-pointer font-medium">
               <option value="">Tất cả trường</option>
             </select>
          </div>
          <div class="md:col-span-3">
             <select id="filterLop" onchange="loadHocSinhList()" class="w-full px-4 py-3 rounded-xl cursor-pointer font-medium">
               <option value="">Tất cả lớp</option>
             </select>
          </div>
          <div class="md:col-span-6">
             <div class="relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-[#00b5e2]"></i>
                <input type="text" id="filterTen" oninput="loadHocSinhList()" placeholder="Tìm tên học sinh hoặc ID..." class="w-full pl-10 pr-4 py-3 rounded-xl font-medium">
             </div>
          </div>
        </div>

        <div class="rounded-xl overflow-hidden border border-[#bae6fd] bg-[#f8fafc] shadow-inner">
          <div class="max-h-[300px] overflow-y-auto custom-scrollbar">
            <table class="w-full text-[#1e293b] text-sm">
              <thead class="bg-[#e0f2fe] sticky top-0 z-10">
                <tr>
                  <th class="p-3 text-left w-12 border-b border-[#bae6fd]">
                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()" class="w-4 h-4 rounded border-[#00b5e2] text-[#00b5e2] focus:ring-0 cursor-pointer">
                  </th>
                  <th class="p-3 text-left font-bold text-[#004c6d] border-b border-[#bae6fd]">ID</th>
                  <th class="p-3 text-left font-bold text-[#004c6d] border-b border-[#bae6fd]">Họ tên</th>
                  <th class="p-3 text-left font-bold text-[#004c6d] border-b border-[#bae6fd]">Lớp</th>
                  <th class="p-3 text-left font-bold text-[#004c6d] border-b border-[#bae6fd]">Ngày sinh</th>
                </tr>
              </thead>
              <tbody id="hocSinhTableBody" class="divide-y divide-[#e0f2fe]"></tbody>
            </table>
          </div>
          <div id="noStudentMsg" class="p-8 text-center text-[#64748b] font-medium text-sm hidden">
             Chưa có dữ liệu học sinh
          </div>
        </div>
        
        <div class="flex justify-between items-center text-xs font-bold text-[#00b5e2] px-1">
           <span id="selectedCount">Đã chọn: 0 học sinh</span>
        </div>
      </div>

      <div class="p-5 border-t border-[#e0f2fe] flex justify-end gap-3 bg-[#f0f9ff] rounded-b-[24px]">
        <button class="px-6 py-2.5 rounded-xl text-[#64748b] hover:text-[#1e293b] hover:bg-white border border-[#cbd5e1] transition text-sm font-bold" onclick="hideGiaoModal()">
          Đóng
        </button>
        <button id="confirmBtn" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#00b5e2] to-[#004c6d] hover:from-[#0ea5e9] hover:to-[#0f172a] text-white font-bold text-sm shadow-[0_4px_12px_rgba(0,181,226,0.3)] transition-all flex items-center gap-2 transform active:scale-95 hover:-translate-y-1" onclick="giaoNhiemVu()">
          <i class="fas fa-paper-plane"></i> Xác nhận giao bài
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="gbai.js"></script>
</body>
</html>
