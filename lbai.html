<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Làm bài trực tuyến - Smart School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

<link rel="stylesheet" href="style.css">
<style>
  /* =========================================================================================
     CSS TONE AQUA DUBAI PASTEL SÁNG 
     ========================================================================================= */
  body { background: radial-gradient(circle at top right, #38bdf8, #bae6fd); min-height: 100vh; font-family: 'Inter', sans-serif; color: #1e293b; }
  
  :root { 
    --primary: #00b5e2; 
    --primary-light: #e0f2fe; 
    --primary-border: #bae6fd; 
    --success: #10b981; 
    --danger: #fb7185; 
    --gray-50: #f0f9ff; 
    --gray-100: #e0f2fe; 
    --gray-200: #bae6fd; 
    --gray-800: #004c6d; 
  }
  
  .loading-overlay { position: fixed; inset: 0; background: rgba(240,249,255,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: var(--primary); }
  
  /* Hiệu ứng nhấp nháy cho đồng hồ lúc sắp hết giờ */
  .timer.warning { background: var(--danger) !important; color: white !important; animation: pulse 1s infinite; border-color: var(--danger) !important; }
  @keyframes pulse { 0%{transform:scale(1); box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.7);} 50%{transform:scale(1.05); box-shadow: 0 0 0 10px rgba(251, 113, 133, 0);} 100%{transform:scale(1); box-shadow: 0 0 0 0 rgba(251, 113, 133, 0);} }

  /* ==================== BỐ CỤC MỖI CÂU HỎI LÀ 1 KHUNG (CARD) ==================== */
  .question { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 32px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,76,109,.05); border: 1px solid rgba(0,181,226,.15); transition: all 0.3s ease; }
  .question:hover { box-shadow: 0 15px 40px rgba(0,181,226,.1); border-color: var(--primary); transform: translateY(-2px); }
  
  .question.split-layout { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: start; }
  .question.split-layout .question-main { display: flex; flex-direction: column; min-width: 0; }
  .question.split-layout .question-image-wrapper { height: 80mm; width: fit-content; max-width: 100%; background: var(--gray-50); border-radius: 16px; border: 1px solid var(--gray-200); padding: 8px; box-shadow: 0 4px 12px rgba(0,76,109,0.05); align-self: start; }
  .question.split-layout .question-image { height: 100%; width: auto; max-width: 100%; object-fit: contain; display: block; border-radius: 8px; }
  
  .question-header { display: flex; align-items: flex-start; margin-bottom: 20px; gap: 16px; }
  .question-number { flex-shrink: 0; width: 36px; height: 36px; background: linear-gradient(135deg, #00b5e2, #004c6d); color: white; font-size: 1.1rem; font-weight: 800; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,181,226,0.3); }
  
  .question-text { flex: 1; font-size: 1.15rem; font-weight: 700; line-height: 1.6; color: var(--gray-800); padding-top: 4px; text-align: justify; hyphens: auto; }
  
  .question:not(.split-layout) .question-image-wrapper { background: var(--gray-50); border-radius: 16px; border: 1px solid var(--gray-200); padding: 8px; margin: 16px 0 24px 0; text-align: center; }
  .question:not(.split-layout) .question-image { width: 100%; max-height: 60mm; object-fit: contain; border-radius: 8px; }
  
  /* Khối đáp án */
  .answer-item { display: flex; align-items: center; padding: 14px 20px; margin: 10px 0; background: var(--gray-50); border: 2px solid transparent; border-radius: 16px; cursor: pointer; transition: all 0.2s ease; user-select: none; }
  .answer-item:hover { background: var(--gray-100); border-color: var(--primary-border); }
  .answer-item.selected { background: var(--gray-100); border-color: var(--primary); box-shadow: 0 4px 15px rgba(0, 181, 226, 0.15); }
  
  .answer-options { display: flex; align-items: center; justify-content: flex-start; width: 44px; flex-shrink: 0; }
  .tf-options { display: flex; gap: 16px; align-items: center; justify-content: flex-start; width: 160px; min-width: auto; }
  
  .answer-content { flex: 1; font-size: 1.05rem; font-weight: 600; color: #1e293b; text-align: justify; hyphens: auto; }
  
  .answer-label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--gray-800); font-weight: 600; font-size: 0.95rem; }
  .answer-label input[type="radio"], .answer-label input[type="checkbox"] { accent-color: var(--primary); width: 20px; height: 20px; cursor: pointer; margin: 0; }
  
  /* ==================== LATEX & NÚT LỆNH ==================== */
  .katex { font-size: 1.18em !important; }
  .katex-display { margin: 1em 0; }

  .btn-start, .btn-submit { width: 100%; padding: 18px; border: none; border-radius: 20px; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .btn-start { background: linear-gradient(135deg, #00b5e2, #004c6d); color: white; box-shadow: 0 8px 25px rgba(0, 181, 226, 0.3); }
  .btn-start:enabled:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 181, 226, 0.4); background: linear-gradient(135deg, #00c9fa, #005a82); }
  .btn-submit { background: var(--gray-800); color: white; display: none; box-shadow: 0 8px 25px rgba(0, 76, 109, 0.25); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  /* Bảng kết quả cuối bài */
  .final-result { margin: 0 auto 40px; max-width: 600px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(0,181,226,0.2); border-radius: 28px; padding: 40px 32px; text-align: center; box-shadow: 0 20px 50px rgba(0, 76, 109, 0.1); }
  .final-result h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 16px; color: var(--gray-800); }
  .final-result .score { font-size: 4.5rem; font-weight: 900; margin: 20px 0; background: linear-gradient(135deg, #00b5e2, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; text-shadow: 0 4px 20px rgba(0,181,226,0.2); }
  .final-result .score small { font-size: 2rem; color: #94a3b8; -webkit-text-fill-color: #94a3b8; }
  .final-result p { font-size: 1.1rem; margin: 12px 0; color: #64748b; font-weight: 600; }
  .final-result .accuracy { font-size: 1.3rem; font-weight: 800; color: var(--success); }
  
  .back-to-profile { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 24px; padding: 14px 32px; background: var(--gray-50); color: var(--gray-800); border-radius: 50px; font-size: 1.1rem; font-weight: 700; text-decoration: none; transition: all 0.3s ease; border: 1px solid var(--gray-200); }
  .back-to-profile:hover { background: white; border-color: var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,181,226,0.15); }
  
  /* Căn chỉnh màu sắc đáp án đúng/sai khi xem lại */
  .result-item { background: white; border-radius: 24px; padding: 32px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,76,109,.05); border: 1px solid var(--gray-200); position: relative; overflow: hidden; }
  .result-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }
  .result-item.correct { background: #f0fdf4; border-color: #bbf7d0; }
  .result-item.correct::before { background: var(--success); }
  .result-item.wrong { background: #fff1f2; border-color: #fecdd3; }
  .result-item.wrong::before { background: var(--danger); }
  
  /* =========================================================================
     GIAO DIỆN BẢNG CÂU HỎI (DẠNG MODAL VÀ NÚT NỔI)
     ========================================================================= */
  .fab-palette {
    display: none; 
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 9990;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00b5e2, #004c6d);
    color: white;
    border: none;
    box-shadow: 0 4px 15px rgba(0, 181, 226, 0.4);
    font-size: 24px;
    cursor: pointer;
    transition: all 0.3s;
    align-items: center;
    justify-content: center;
  }
  .fab-palette:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 8px 20px rgba(0, 181, 226, 0.5);
  }

  .palette-btn {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    background: #f8fafc;
    color: #64748b;
    font-size: 1.1rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .palette-btn:hover {
    border-color: #00b5e2;
    color: #00b5e2;
  }
  .palette-btn.answered {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: transparent;
    color: white;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  /* Tối ưu riêng cho Mobile */
  @media(max-width:768px){
    .question { padding: 24px 20px; margin-bottom: 16px; border-radius: 20px; }
    .question.split-layout { grid-template-columns: 1fr; gap: 20px; }
    .question.split-layout .question-image-wrapper { height: auto; width: 100%; max-height: 70mm; justify-self: center; margin: 0; }
    .question-text { font-size: 1.05rem; }
    .answer-content { font-size: 0.95rem; }
    .answer-item { padding: 12px 16px; margin: 8px 0; border-radius: 12px; }
    .tf-options { width: auto; min-width: 120px; gap: 10px; }
    .final-result { padding: 32px 24px; }
    .final-result .score { font-size: 3.5rem; }
    .final-result h2 { font-size: 1.5rem; }
    .result-item { padding: 24px 20px; border-radius: 20px; }
  }
</style>
</head>
<body class="antialiased relative">

<div id="loading" class="loading-overlay">
  <div class="w-12 h-12 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4 shadow-lg"></div>
  <div class="font-bold tracking-wide text-sm text-[#004c6d]">Đang chuẩn bị dữ liệu...</div>
</div>

<div id="global-header"></div>

<div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
  <div class="w-full">
    <button id="btnStart" class="btn-start" disabled><i class="fas fa-play"></i> BẮT ĐẦU LÀM BÀI!</button>
    <div id="quiz" class="mt-4"></div>
    <button id="submit" class="btn-submit mt-6" disabled><i class="fas fa-paper-plane"></i> Nộp bài thi</button>
    <div id="msg"></div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<button id="fabPaletteBtn" class="fab-palette" onclick="document.getElementById('paletteModal').style.display='flex'" title="Mở danh sách câu hỏi">
  <i class="fas fa-th-large"></i>
</button>

<div id="paletteModal" style="display:none; position:fixed; inset:0; background:rgba(0,30,43,0.6); z-index:99999; justify-content:center; align-items:center; padding:16px; backdrop-filter:blur(4px);">
  <div style="background:#fff; width:100%; max-width:450px; border-radius:24px; overflow:hidden; box-shadow:0 25px 50px rgba(0,181,226,0.2);">
    <div style="background:linear-gradient(135deg, #00b5e2, #004c6d); color:white; padding:16px 24px; font-size:1.1rem; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
      <span><i class="fas fa-tasks mr-2"></i> Bảng câu hỏi</span>
      <span onclick="document.getElementById('paletteModal').style.display='none'" style="cursor:pointer; font-size:28px; line-height:1;">&times;</span>
    </div>
    <div style="padding:24px; max-height:60vh; overflow-y:auto; background:#f0f9ff;">
      <div id="paletteGrid" style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="lbai.js"></script>

</body>
</html>
