<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soạn câu hỏi - Smart School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  
  <link rel="stylesheet" href="style.css"> 
  
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================
       CSS RIÊNG CỦA TRANG SOẠN CÂU HỎI (LAYOUT VÀ TOOLBAR)
       Toàn bộ CSS thẻ câu hỏi đã được xóa để lấy từ style.css
    ========================================================= */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; width: 100%; font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #38bdf8, #bae6fd); min-height: 100vh; color: white; font-size: 14px; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(240, 249, 255, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #00b5e2; }
    
    .left-panel, .right-panel { display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.95); border-radius: 16px; box-shadow: 0 8px 24px rgba(0,76,109,0.08); overflow: hidden; transition: all .4s cubic-bezier(.25,.8,.25,1); height: 100%; border: 1px solid rgba(0, 181, 226, 0.1); backdrop-filter: blur(10px); }
    .left-panel:hover, .right-panel:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,181,226,0.12); border-color: rgba(0, 181, 226, 0.2); }
    
    .panel-content { padding: 24px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: #00b5e2 #f0f9ff;}
    .right-panel .panel-content { padding: 24px 8px 24px 24px; }
    
    #newBtn{color:#10b981;} #newBtn:hover:not(:disabled){background:#ecfdf5;color:#059669;}
    #editBtn{color:#00b5e2;} #editBtn:hover:not(:disabled){background:#f0f9ff;color:#004c6d;}
    #saveBtn{color:#004c6d;} #saveBtn:hover:not(:disabled){background:#e0f2fe;color:#00334e;}
    #delBtn{color:#fb7185;} #delBtn:hover:not(:disabled){background:#fff1f2;color:#e11d48;}
    #copyBtn{color:#f59e0b;} #copyBtn:hover:not(:disabled){background:#fffbeb;color:#d97706;}
    
    .loading { animation: spin 1s linear infinite; }
    @keyframes spin { 0% {transform: rotate(0deg)} 100% {transform: rotate(360deg)} }
    
    .preview-cards { display: flex; flex-direction: column; padding-right: 12px; }
    
    .pagination { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:24px; padding-bottom:10px; flex-shrink:0; }
    .pagination button { padding:10px 16px; border:1px solid #e0f2fe; background:white; border-radius:10px; cursor:pointer; color:#64748b; transition:all .2s ease; box-shadow:0 2px 4px rgba(0,76,109,0.02); }
    .pagination button i { font-size: 16px; }
    .pagination button:hover:not(:disabled) { background:#f0f9ff; color:#00b5e2; border-color:#00b5e2; transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,181,226,0.15); }
    .pagination button:disabled { opacity:0.4; cursor:not-allowed; background:#f8fafc; }
    .pagination .page-info { font-weight:600; color:#00b5e2; font-size:15px; margin: 0 10px; background: #f0f9ff; padding: 8px 16px; border-radius: 20px; }

    select option { padding: 10px 16px; background-color: #ffffff; color: #004c6d; font-weight: 500; }
  </style>
</head>
<body class="flex flex-col h-screen text-white antialiased">

  <div id="loading" class="loading-overlay">
    <div class="w-14 h-14 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="font-bold tracking-wide">Đang kết nối hệ thống...</div>
  </div>

  <div id="global-header"></div>

  <div class="w-full flex-1 flex px-6 gap-6 pb-6 pt-6 overflow-hidden text-gray-800 mt-0">
    
    <div class="left-panel w-1/2 flex flex-col rounded-2xl">
      <div class="panel-content">
        <form id="f" class="flex flex-col gap-4">



          <div class="grid grid-cols-2 gap-x-5 gap-y-3">
            
            <div class="flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Môn học">
                <i class="fas fa-book text-[16px]"></i>
              </div>
              <select name="SubjectID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="loadKhoi(); updateSaveStatus();">
                <option value="">Đang tải...</option>
              </select>
            </div>

            <div class="flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Khối lớp">
                <i class="fas fa-users text-[16px]"></i>
              </div>
              <select name="BlockID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="loadChude(); updateSaveStatus();">
                <option value="">Đang tải...</option>
              </select>
            </div>

            <div class="flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Loại câu hỏi">
                <i class="fas fa-question-circle text-[16px]"></i>
              </div>
              <select name="TypeID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="updateSaveStatus();">
                <option value="">Đang tải...</option>
              </select>
            </div>

            <div class="flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Mức độ">
                <i class="fas fa-signal text-[16px]"></i>
              </div>
              <select name="LevelID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm" onchange="updateSaveStatus();">
                <option value="">Đang tải...</option>
              </select>
            </div>

            <div class="flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Chủ đề">
                <i class="fas fa-layer-group text-[16px]"></i>
              </div>
              <select name="TopicID" class="flex-1 min-w-0 truncate h-[30px] px-3 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm">
                <option value="">Đang tải...</option>
              </select>
            </div>

            <div class="flex items-center gap-2 min-w-0">
              <div class="w-[30px] h-[30px] shrink-0 flex items-center justify-center bg-[#e0f2fe] rounded-xl text-[#00b5e2] cursor-help transition-all hover:bg-[#00b5e2] hover:text-white shadow-sm" title="Tìm kiếm từ khóa">
                <i class="fas fa-search text-[16px]"></i>
              </div>
              <input type="text" id="searchKeyword" name="searchKeyword" placeholder="Nhập từ khóa..." class="flex-1 min-w-0 h-[30px] px-4 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all shadow-sm">
            </div>

          </div>

          <div class="flex items-center justify-center gap-2 mt-2 mb-1 bg-white h-[52px] px-3 rounded-2xl border border-[#e0f2fe] shadow-[0_2px_10px_rgba(0,181,226,0.05)] w-max mx-auto hover:shadow-[0_4px_15px_rgba(0,181,226,0.15)] transition-shadow">
            
            <button type="button" id="btnFilter" onclick="filter()" class="h-[36px] px-4 flex items-center justify-center gap-2 rounded-xl text-white font-bold transition-all duration-300 bg-gradient-to-r from-[#00b5e2] to-[#004c6d] hover:shadow-md" title="Bấm để lọc dữ liệu">
                <i class="fas fa-filter text-[13px]"></i> <span class="text-[13px]">Lọc</span>
            </button>
            
            <div class="w-px h-[24px] bg-gray-200 mx-1"></div> <div id="navDisplay" class="min-w-[90px] h-[36px] flex items-center justify-center text-[14px] px-3 m-0 rounded-xl border !border-[#bbf7d0] !bg-[#f0fdf4] !text-[#16a34a] font-bold whitespace-nowrap transition-colors">1/0</div>
            <button type="button" id="prevBtn" onclick="nav(-2)" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl hover:bg-gray-100 text-gray-700 transition-colors outline-none"><i class="fas fa-step-backward text-[14px]"></i></button>
            <button type="button" id="nextBtn" onclick="nav(2)" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl hover:bg-gray-100 text-gray-700 transition-colors outline-none"><i class="fas fa-step-forward text-[14px]"></i></button>
            <div class="w-px h-[24px] bg-gray-200 mx-1"></div> 
            <button type="button" id="newBtn" onclick="newMode()" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-plus-circle text-[16px]"></i></button>
            <button type="button" id="copyBtn" onclick="copyMode()" style="display:none" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-copy text-[16px]"></i></button>
            <button type="button" id="editBtn" onclick="editMode()" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-edit text-[16px]"></i></button>
            <div class="flex items-center justify-center w-[36px] h-[36px] rounded-xl hover:bg-[#f0f9ff] text-[#00b5e2] cursor-pointer transition-colors outline-none" id="uploadButton" onclick="document.getElementById('imageUpload').click()" title="Đính kèm ảnh">
              <i class="fas fa-image text-[16px]" id="uploadIcon"></i>
              <input type="file" id="imageUpload" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
            </div>
            <button type="button" id="saveBtn" onclick="save()" style="display:none" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-save text-[16px]"></i></button>
            <button type="button" id="delBtn" onclick="del()" style="display:none" class="flex items-center justify-center w-[36px] h-[36px] rounded-xl outline-none"><i class="fas fa-trash-alt text-[16px]"></i></button>
            <div id="statusIcon"></div>
          </div>

          <div class="w-full mt-0 mb-0">
            <textarea name="QuestionLabel" placeholder="Nhập nội dung câu dẫn..." class="w-full min-h-[50px] p-4 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed font-medium shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
          </div>



          <div class="flex gap-4">
            
            <div class="flex-[3] flex flex-col gap-3">
              <textarea name="A" placeholder="Phương án A" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
              <textarea name="B" placeholder="Phương án B" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
              <textarea name="C" placeholder="Phương án C" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
              <textarea name="D" placeholder="Phương án D" class="w-full min-h-[20px] h-[20px] px-4 py-1 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#00b5e2] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this); updateSaveStatus();"></textarea>
            </div>

            <div class="flex-[2] flex flex-col">
              <div class="w-full h-full min-h-[116px] border-2 border-dashed border-[#bae6fd] rounded-2xl bg-[#f0f9ff] flex flex-col items-center justify-center relative overflow-hidden group cursor-pointer hover:bg-[#e0f2fe] hover:border-[#00b5e2] transition-all" onclick="if(edit) document.getElementById('imageUpload').click()" title="Click để tải ảnh lên">
                
                <img id="formImagePreview" src="" class="absolute inset-0 w-full h-full object-contain hidden p-2 z-10 bg-white" />
                
                <div id="formImagePlaceholder" class="text-center text-[#7dd3fc] group-hover:text-[#00b5e2] transition-colors">
                  <i class="fas fa-image text-3xl mb-2"></i>
                  <p class="text-xs font-medium">Click / Kéo thả ảnh</p>
                </div>

                <button type="button" id="removeImageBtn" class="absolute top-2 right-2 w-8 h-8 bg-white border border-gray-200 hover:bg-red-50 text-red-500 rounded-full shadow-md hidden z-20 transition-all hover:scale-110" onclick="event.stopPropagation(); removeFormImage();" title="Xóa ảnh">
                  <i class="fas fa-trash-alt text-[13px]"></i>
                </button>
              </div>
            </div>

          </div>

          <div class="w-full flex gap-3">
              <textarea name="Note" placeholder="Ghi chú" class="flex-1 min-h-[30px] h-[30px] px-4 py-1.5 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#f59e0b] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this);"></textarea>
              <textarea name="Keywords" placeholder="Từ khóa tìm kiếm nhanh" class="flex-1 min-h-[30px] h-[30px] px-4 py-1.5 bg-[#f0f9ff] border border-[#e0f2fe] rounded-xl text-gray-800 focus:bg-white focus:ring-2 focus:ring-[#f59e0b] outline-none transition-all resize-none overflow-hidden leading-relaxed shadow-sm" oninput="autoResize(this);"></textarea>
          </div>


        </form>
      </div>
    </div>

    <div class="right-panel w-1/2 rounded-2xl">
      <div class="panel-content">
        <div class="preview-cards" id="previewCards"><em class="text-[#004c6d] opacity-60">Nhấn Lọc dữ liệu để xem danh sách câu hỏi</em></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
  <script src="soanch.js"></script>

</body>
</html>
