<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart School - Hệ Thống Quản Lý Trắc Nghiệm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Chuyển nền sang dải gradient Aqua Pastel Sáng (Sky Blue sang Ngọc bích nhạt) */
    body { background: radial-gradient(circle at top right, #00b5e2, #004c6d); min-height: 100vh; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); }
    .menu-item { transition: all 0.3s ease; padding: 10px 12px; border-radius: 12px; }
    .menu-item:hover { background: rgba(255,255,255,0.25); transform: translateX(5px); }
    .submenu-container { max-height: 0; overflow: hidden; transition: all 0.4s ease-out; opacity: 0; padding-left: 1.5rem; }
    .submenu-container.open { max-height: 200px; opacity: 1; margin-top: 0.5rem; }
    .submenu-item { position: relative; padding-left: 1rem; border-left: 1px dashed rgba(255,255,255,0.5); }
    .rotate-icon { transition: transform 0.3s ease; }
    .rotate-icon.rotate { transform: rotate(90deg); }
    .loading-overlay { position: fixed; inset: 0; background: rgba(240, 249, 255, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #00b5e2; }
  </style>
</head>
<body class="text-white antialiased">
  
  <div id="loading" class="loading-overlay">
    <div class="w-14 h-14 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="font-bold tracking-wide text-lg animate-pulse">Đang kết nối hệ thống...</div>
  </div>

  <div id="mainContent">
    <div id="global-header"></div>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <section class="text-center mb-10">
        <h2 class="text-3xl md:text-5xl font-extrabold mb-3 text-[#004c6d]">SMART SCHOOL<br><span class="text-[#00b5e2]">--- & ---</span></h2>
        <p class="text-[#004c6d] text-sm md:text-base opacity-80 font-medium">Tạo ngân hàng câu hỏi • Soạn đề tự động • Thi trực tuyến</p>
      </section>
      <div id="featureGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="customModal" class="fixed inset-0 z-[10000] flex items-center justify-center hidden"><div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div><div id="modalContent" class="glass relative max-w-sm w-full mx-4 p-8 rounded-[2rem] shadow-2xl border border-white/40 transform scale-90 opacity-0 transition-all duration-300"><div class="text-center"><div id="modalIcon"></div><h3 id="modalTitle" class="text-2xl font-bold mb-2 text-[#004c6d]"></h3><p id="modalMessage" class="text-[#004c6d] opacity-80 mb-8 font-medium"></p><div class="flex space-x-3"><button id="btnCancel" class="flex-1 px-6 py-3 bg-white/30 text-[#004c6d] hover:bg-white/50 rounded-2xl font-bold transition-colors">Hủy</button><button id="btnConfirm">Đồng ý</button></div></div></div></div>

  <script src="script.js"></script>
  <script src="index.js"></script>
</body>
</html>
