<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang cá nhân - Smart School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* =========================================================================================
       CSS TONE AQUA DUBAI PASTEL SÁNG 
       ========================================================================================= */
    /* Tone màu nền Pastel sáng và dịu mắt (Đồng bộ Lựa chọn 2) */
    body { background: radial-gradient(circle at top right, #38bdf8, #bae6fd); min-height: 100vh; font-family: 'Inter', sans-serif; color: #1e293b; }
    
    /* Giao diện Thẻ nhiệm vụ sáng màu, bo góc lớn, viền nhạt */
    .card-glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(0, 181, 226, 0.15); box-shadow: 0 10px 30px rgba(0, 76, 109, 0.05); border-radius: 20px; overflow: hidden; transition: all 0.3s ease; }
    .card-glass:hover { transform: translateY(-4px); box-shadow: 0 15px 40px rgba(0, 181, 226, 0.15); border-color: rgba(0, 181, 226, 0.3); }
    
    /* Thanh tiến trình bản sáng */
    .progress-bar { background: rgba(0,181,226,0.1); border-radius: 6px; overflow: hidden; position: relative; width: 100%; height: 8px; }
    .progress-fill { height: 100%; width: 0%; border-radius: 6px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    /* Giữ nguyên màu Trạng thái điểm số để cảnh báo tốt hơn */
    .progress-fill.luot { background: linear-gradient(90deg, #10b981, #34d399); } /* Xanh lá */
    .progress-fill.tb { background: linear-gradient(90deg, #0ea5e9, #38bdf8); } /* Đổi xanh dương thành Aqua nhạt */
    .progress-fill.cao { background: linear-gradient(90deg, #f59e0b, #fbbf24); } /* Hổ phách */
    
    /* Nút bấm làm bài */
    .btn-play { border-radius: 12px; font-weight: 700; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: white; padding: 10px 20px; border: none; }
    .btn-play.complete { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
    .btn-play.incomplete { background: linear-gradient(135deg, #00b5e2, #004c6d); box-shadow: 0 4px 15px rgba(0, 181, 226, 0.2); } /* Chuyển sang Aqua Dubai */
    .btn-play:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 181, 226, 0.3); }
    .btn-play:active { transform: scale(0.98); }
    .btn-play:disabled { cursor: not-allowed; opacity: 0.6; background: #cbd5e1; color: #64748b; box-shadow: none; }
    
    /* Màn hình Loading */
    .loading-overlay { position: fixed; inset: 0; background: rgba(240, 249, 255, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #00b5e2; transition: opacity 0.3s; }
    
    /* Custom Scrollbar */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,181,226,0.05); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,181,226,0.2); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,181,226,0.4); }
  </style>
</head>
<body class="antialiased">

  <input type="file" id="uploadInput" style="display: none;" onchange="xuLyFileDaChon()">

  <div id="loading" class="loading-overlay">
    <div class="w-14 h-14 border-4 border-[#00b5e2] border-t-transparent rounded-full animate-spin mb-4"></div>
    <div id="loadingText" class="font-bold tracking-wide text-sm text-[#004c6d]">Đang tải dữ liệu...</div>
  </div>

  <div id="mainContent">
    <div id="global-header"></div>

    <main class="w-full mx-auto px-4 md:px-8 lg:px-10 py-8">
      
      <div id="taskList" class="grid grid-cols-1 xl:grid-cols-2 gap-6 xl:gap-8"></div>
      
      <div id="noTask" class="text-center py-24 bg-white/40 backdrop-blur-md rounded-3xl border border-white/50 shadow-sm" style="display:none;">
        <i class="fas fa-check-circle text-7xl text-[#0ea5e9] opacity-50 mb-5 animate-bounce"></i>
        <p class="text-xl font-bold text-[#004c6d] opacity-80">Tuyệt vời! Hiện không có bài tập nào cần làm.</p>
        <p class="text-sm text-[#64748b] mt-2">Bạn có thể nghỉ ngơi hoặc ôn lại bài cũ.</p>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="script.js"></script>
  <script src="hsinh.js"></script>
</body>
</html>
